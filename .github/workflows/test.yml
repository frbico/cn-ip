name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: |
          python -m py_compile cnip.py
          bash -n install.sh
          bash -n publish.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v
  nginx-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
      - name: Run real Nginx host/IP integration regression
        run: python -m unittest discover -s tests -v
      - name: Installer smoke tests as root
        run: sudo "$(which python)" -m unittest discover -s tests -p test_install.py -v
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, nginx-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish v1.0.1 only after all checks pass
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'v1.0.1';
            const repo = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({...repo, tag});
              core.info(`${tag} already exists; leaving it unchanged.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createRelease({
              ...repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: 'cn-ip v1.0.1',
              body: [
                '修复中文交互菜单的静默等待及首次 IP 库更新问题。',
                '',
                '- Docker、Nginx、systemd 与下载调用均设有超时，增加阶段提示。',
                '- 菜单空闲及结果停留时释放操作锁；并发操作立即提示。',
                '- 第 3 项明确显示状态，第 4 项支持未启用域名时初始化 IPv4/IPv6 库。',
                '- 操作结果停留显示，只有 Enter 才返回主菜单；所有输入处 Ctrl+C 退出工具。',
                '- 配置写入中按 Ctrl+C 同样回滚，补充完整菜单流程与阻塞回归测试。',
                '',
                '升级前先在旧菜单输入 0 退出，再重新运行 README 中的安装命令。'
              ].join('\n'),
              draft: false,
              prerelease: false
            });
