name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: |
          python -m py_compile cnip.py
          bash -n install.sh
          bash -n publish.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v
  nginx-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
      - name: Run real Nginx host/IP integration regression
        run: python -m unittest discover -s tests -v
      - name: Installer smoke tests as root
        run: sudo "$(which python)" -m unittest discover -s tests -p test_install.py -v
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, nginx-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish v1.0.4 only after all checks pass
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'v1.0.4';
            const repo = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({...repo, tag});
              core.info(`${tag} already exists; leaving it unchanged.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createRelease({
              ...repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: 'cn-ip v1.0.4',
              body: [
                '新增旧版域名规则的交互确认迁移。',
                '',
                '- 菜单 1 检测到已知旧 include 后，显示变更范围并要求明确确认。',
                '- 仅替换目标 server 的旧引用，保留共享旧文件与其他网站引用。',
                '- 同一 server 存在其他未选择域名或嵌套旧规则时，安全停止。',
                '- 配置变更沿用自动备份、验证、重载与失败回滚流程。',
                '- 修复注释中的旧路径被误认为有效规则的问题。',
                '',
                '旧文件中的自定义放行 IP 不会自动导入，请迁移前核实并另行添加。'
              ].join('\n'),
              draft: false,
              prerelease: false
            });
