name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: |
          python -m py_compile cnip.py
          bash -n install.sh
          bash -n publish.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v
  nginx-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
      - name: Run real Nginx host/IP integration regression
        run: python -m unittest discover -s tests -v
      - name: Installer smoke tests as root
        run: sudo "$(which python)" -m unittest discover -s tests -p test_install.py -v
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, nginx-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish v1.0.2 only after all checks pass
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'v1.0.2';
            const repo = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({...repo, tag});
              core.info(`${tag} already exists; leaving it unchanged.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createRelease({
              ...repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: 'cn-ip v1.0.2',
              body: [
                '优化中文终端界面，提升菜单与状态结果的可读性。',
                '',
                '- 主菜单按域名与 IP 库、访问例外、维护与备份分组，统一编号与间距。',
                '- 状态页分区显示运行环境、域名、IP 地址库和访问例外。',
                '- 中文标签按显示宽度对齐，时间去除微秒并明确显示服务器本地时区。',
                '- 删除重复容器信息，自动更新子菜单与备份页采用清晰分行排版。',
                '- 保留 Enter 返回主菜单、所有输入处 Ctrl+C 退出及中断回滚逻辑。',
                '',
                '升级前在旧菜单输入 0 退出，再重新执行 README 中的安装命令。'
              ].join('\n'),
              draft: false,
              prerelease: false
            });
