name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: |
          python -m py_compile cnip.py
          bash -n install.sh
          bash -n publish.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v
  nginx-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
      - name: Run real Nginx host/IP integration regression
        run: python -m unittest discover -s tests -v
      - name: Installer smoke tests as root
        run: sudo "$(which python)" -m unittest discover -s tests -p test_install.py -v
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, nginx-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish v1.0.0 only after all checks pass
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'v1.0.0';
            const repo = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({...repo, tag});
              core.info(`${tag} already exists; leaving it unchanged.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createRelease({
              ...repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: 'cn-ip v1.0.0',
              body: [
                '首个正式版本：面向 1Panel 社区版与 OpenResty 的中国大陆 IP 访问限制管理工具。',
                '',
                '- 支持指定域名、IPv4/IPv6 白名单及中文数字菜单。',
                '- 支持证书验证路径例外、自定义 IP 放行和每日自动更新。',
                '- 配置变更自动备份，检测或重载失败回滚，支持恢复与卸载。',
                '- 支持单文件下载安装；Cloudflare 可保持灰云，无需 CDN/WAF。',
                '',
                '已通过自动测试；真实 1Panel 布局、证书续期及境内外访问仍需在目标服务器验证。'
              ].join('\n'),
              draft: false,
              prerelease: false
            });
