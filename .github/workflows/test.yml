name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: |
          python -m py_compile cnip.py
          bash -n install.sh
          bash -n publish.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v
  nginx-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
      - name: Run real Nginx host/IP integration regression
        run: python -m unittest discover -s tests -v
      - name: Installer smoke tests as root
        run: sudo "$(which python)" -m unittest discover -s tests -p test_install.py -v
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, nginx-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish v1.0.3 only after all checks pass
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'v1.0.3';
            const repo = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({...repo, tag});
              core.info(`${tag} already exists; leaving it unchanged.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createRelease({
              ...repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: 'cn-ip v1.0.3',
              body: [
                '统一其他管理页面的排版，改善诊断、备份与操作结果的阅读体验。',
                '',
                '- 诊断和自动更新状态分区显示，检查结论及后续操作更清楚。',
                '- 备份列表增加序号，交互恢复支持序号或完整名称。',
                '- 配置变更显示三步进度，成功结果与备份路径分行展示。',
                '- 卸载结果分别说明规则、命令文件、定时更新及备份状态。',
                '- 保留 Enter 返回、Ctrl+C 退出及自动回滚逻辑。',
                '',
                '升级前在旧菜单输入 0 退出，再重新执行 README 中的安装命令。'
              ].join('\n'),
              draft: false,
              prerelease: false
            });
